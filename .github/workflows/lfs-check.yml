name: lfs-check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SIZE: "2097152"

jobs:
  with-lfs:
    name: checkout with lfs true
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (lfs: true)"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify real 2 MiB object
        run: |
          set -euo pipefail
          git lfs version
          ls -l assets/sample.bin
          size=$(stat -c%s assets/sample.bin)
          echo "size=$size expected=$EXPECTED_SIZE"
          test "$size" -eq "$EXPECTED_SIZE"
          sha256sum -c assets/sample.sha256
          echo "--- git lfs ls-files ---"
          git lfs ls-files
          echo "--- fsck ---"
          git lfs fsck
          echo "VERDICT=real-object"

      - name: Show that the git blob is only a pointer
        run: |
          set -euo pipefail
          blob=$(git rev-parse HEAD:assets/sample.bin)
          echo "blob size in git: $(git cat-file -s "$blob") bytes"
          git cat-file -p "$blob"

  without-lfs:
    name: checkout without lfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default, no lfs)
        uses: actions/checkout@v4

      - name: Verify we only got a pointer
        run: |
          set -euo pipefail
          ls -l assets/sample.bin
          size=$(stat -c%s assets/sample.bin)
          echo "size=$size"
          echo "--- content ---"
          cat assets/sample.bin
          if [ "$size" -lt 1000 ]; then
            echo "VERDICT=pointer-only"
          else
            echo "VERDICT=unexpected-big-file"
            exit 1
          fi

  manual-pull:
    name: plain checkout then git lfs pull
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default)
        uses: actions/checkout@v4

      - name: Fetch objects by hand
        run: |
          set -euo pipefail
          echo "before: $(stat -c%s assets/sample.bin) bytes"
          git lfs install --local
          git lfs pull
          echo "after:  $(stat -c%s assets/sample.bin) bytes"
          sha256sum -c assets/sample.sha256
          echo "VERDICT=manual-pull-ok"
